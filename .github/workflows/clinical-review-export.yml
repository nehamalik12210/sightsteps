name: Clinical review export

on:
  push:
    branches:
      - main
    paths:
      - "scripts/export-prompts.mjs"
      - "src/data/patterns.js"
      - "src/data/patternClusters.js"
      - "src/data/i18n.js"
      - "src/data/questions.js"
      - "src/data/demoPersona.js"
      - "src/engine/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clinical-review-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate bilingual clinical review export
        run: npm run export-review
      - name: Capture dependency audit report
        run: |
          mkdir -p exports
          npm audit --json > exports/npm-audit.json || true
      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinical-review-export
          path: |\n            exports/clinical-review-export.txt\n            exports/npm-audit.json
          if-no-files-found: error
          retention-days: 14
